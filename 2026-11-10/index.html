<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Résumé en français et carte mentale de la conférence du Cheikh Abd Razzaq Al Badr au Masjid Nabawi, 10/11/2026.">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Cours du 10/11 : le Tawhid, le danger du shirk et l’ostentation</title>

<style>
/* Layout : page de résumé type Plaud (colonne centrée 768px), puis carte mentale en encadré qui s'ouvre en plein écran */
:root {
  --bg: #ffffff;
  --fg: #111113;
  --muted: #6b6b70;
  --line: #e6e6e8;
  --quote: #c9c9ce;
  --panel: #ffffff;
  --panel-shadow: 0 2px 10px rgba(0,0,0,.10);
  --circle-open: #ffffff;
  --map-font: 300 16px/20px sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1c1e; --fg: #f2f2f2; --muted: #a1a1a6; --line: #38383a; --quote: #4a4a4e;
    --panel: #2c2c2e; --panel-shadow: 0 2px 10px rgba(0,0,0,.45); --circle-open: #1c1c1e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1c1e; --fg: #f2f2f2; --muted: #a1a1a6; --line: #38383a; --quote: #4a4a4e;
  --panel: #2c2c2e; --panel-shadow: 0 2px 10px rgba(0,0,0,.45); --circle-open: #1c1c1e;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 15px; line-height: 1.6;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top h1 { margin: 0; font-size: 13px; font-weight: 600; line-height: 1.35; text-wrap: balance; }
.top p { margin: 2px 0 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
main {
  max-width: 768px; margin: 0 auto;
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tabs { display: flex; gap: 20px; font-size: 13px; margin-bottom: 20px; }
.tabs span { color: var(--muted); }
.tabs strong { font-weight: 600; }
blockquote { margin: 0 0 8px; padding: 2px 0 2px 14px; border-left: 3px solid var(--quote); color: var(--muted); font-size: 14px; }
blockquote strong { color: var(--fg); font-weight: 600; }
h2 { font-size: 21px; line-height: 1.3; margin: 32px 0 12px; text-wrap: balance; }
h3 { font-size: 17px; line-height: 1.35; margin: 26px 0 8px; text-wrap: balance; }
h4 { font-size: 15px; line-height: 1.4; margin: 16px 0 4px; color: var(--muted); }
p { margin: 0 0 12px; }
ul, ol { margin: 0 0 12px; padding-left: 22px; }
li { margin: 6px 0; }
li > ul, li > ol { margin: 6px 0 0; }
.todo { list-style: none; padding-left: 0; }
.todo li { display: flex; gap: 10px; align-items: flex-start; }
.todo input { margin-top: 5px; flex: none; width: 15px; height: 15px; accent-color: var(--muted); }
.todo label { min-width: 0; }

.mapcard {
  position: relative; margin-top: 40px; height: 320px;
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg);
}
.mapcard .label { position: absolute; top: 10px; left: 12px; font-size: 12px; color: var(--muted); z-index: 2; }
.mapcard .open {
  position: absolute; inset: 0; z-index: 3; border: 0; background: transparent; cursor: zoom-in;
}
.mapcard .open:focus-visible { outline: 2px solid var(--muted); outline-offset: -3px; }
#mm {
  width: 100%; height: 100%; display: block;
  --markmap-text-color: var(--fg);
  --markmap-circle-open-bg: var(--circle-open);
  --markmap-max-width: 300px;
  --markmap-font: var(--map-font);
}
.controls, .close { display: none; }
.mapcard.full {
  position: fixed; inset: 0; z-index: 20; margin: 0; height: auto; border: 0; border-radius: 0;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
.mapcard.full .open, .mapcard.full .label { display: none; }
.mapcard.full .controls {
  display: flex; position: absolute;
  right: calc(16px + env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  gap: 4px; padding: 6px; background: var(--panel); border-radius: 10px; box-shadow: var(--panel-shadow);
}
.mapcard.full .close {
  display: grid; place-items: center; position: absolute;
  top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px));
  width: 36px; height: 36px; border: 0; border-radius: 8px; background: var(--panel); box-shadow: var(--panel-shadow);
  color: var(--fg); cursor: pointer;
}
.controls button {
  width: 32px; height: 32px; border: 0; border-radius: 6px;
  background: transparent; color: var(--fg); cursor: pointer; display: grid; place-items: center;
}
.controls button:hover { background: var(--line); }
.controls button:focus-visible, .close:focus-visible { outline: 2px solid var(--muted); outline-offset: 1px; }
.ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
footer { text-align: center; font-size: 12px; color: var(--muted); padding-block: 8px 32px; }
</style>
</head>
<body>


<div class="top">
  <h1>Conférence : le Tawhid, le danger du shirk et l’ostentation</h1>
  <p>2026-11-10 19:09 · Cheikh Abd Razzaq Al Badr</p>
</div>

<main>
  <div class="tabs"><strong>Résumé</strong></div>
  <div id="doc"></div>

  <section class="mapcard" id="card" aria-label="Carte mentale">
    <span class="label">Carte mentale</span>
    <svg id="mm" class="markmap"></svg>
    <button class="open" id="open" type="button" aria-label="Ouvrir la carte mentale en plein écran"></button>
    <button class="close" id="close" type="button" title="Fermer" aria-label="Fermer la carte"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="controls" role="toolbar" aria-label="Commandes de la carte">
      <button id="zin" type="button" title="Zoom avant" aria-label="Zoom avant"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M16.5 16.5L21 21"/></svg></button>
      <button id="zout" type="button" title="Zoom arrière" aria-label="Zoom arrière"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M16.5 16.5L21 21"/></svg></button>
      <button id="fit" type="button" title="Ajuster à l'écran" aria-label="Ajuster à l'écran"><svg class="ico" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg></button>
      <button id="all" type="button" title="Tout déplier" aria-label="Tout déplier"><svg class="ico" viewBox="0 0 24 24"><path d="M4 6h16M8 12h12M12 18h8"/><circle cx="4" cy="12" r="0.8"/><circle cx="8" cy="18" r="0.8"/></svg></button>
    </div>
  </section>
</main>
<footer>Traduction française de la note Plaud du 10/11/2026</footer>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.10/dist/browser/index.js"></script>
<script>
const n = (content, children, fold) => ({ content, children: children || [], payload: fold ? { fold: 1 } : {} });
const data = n('Conférence : le Tawhid, le danger du shirk et l’ostentation', [
  n('Relevé', [
    n('Date : 2026-11-10'),
    n('Heure : 19:09:50'),
    n('Lieu : Masjid Nabawi, Médine'),
    n('Conférencier : Cheikh Abd Razzaq Al Badr'),
  ], 1),
  n('Résumé', [
    n('La conférence traite du danger du shirk et de l’obligation de le craindre pour soi-même et pour sa descendance, et de le connaître pour s’en préserver, en insistant sur l’ostentation (riyâ) comme shirk mineur et danger menaçant les œuvres à l’heure où filmer et diffuser les actes d’adoration se répand. Elle traite aussi de questions tirées des textes du Tawhid, telles que la leçon tirée de l’état du plus grand nombre, l’interprétation de la parole du Tawhid « Lâ ilâha illa Allah » et les conditions pour en profiter selon la méthode des imams du hadith comme l’imam Boukhari, et le mérite d’être préservé du shirk pour obtenir le salut et entrer au Paradis, en insistant sur la nécessité de la sincérité, de l’invocation et de l’œuvre pieuse sans s’en remettre au destin seul, et s’achève par l’invocation collective pour les musulmans.'),
  ], 1),
  n('Points de connaissance', [
    n('1. Le shirk, son danger et l’obligation de s’en méfier pour soi-même et sa descendance', [
      n('La gravité du shirk et le repentir qui s’y rapporte', [
        n('Le shirk a été associé aux plus grands péchés comme le meurtre et l’adultère, avec l’exposé de la gravité de sa menace. Les textes montrent que celui qui se repent sincèrement avant la mort, Allah accepte son repentir et lui accorde Sa miséricorde, tandis que celui qui meurt dessus ou persiste n’a aucun espoir de salut ni de pardon.'),
      ]),
      n('La crainte du shirk et le souci pour soi-même et sa famille', [
        n('Obligation pour celui qui connaît le Tawhid de craindre le shirk pour lui-même et pour sa descendance, en suivant l’exemple de l’invocation d’Abraham, l’ami intime d’Allah (paix sur lui) : ﴾Préserve-moi, ainsi que mes enfants, de l’adoration des idoles﴿ ; si celui qui a brisé les idoles craignait pour lui-même, ceux qui lui sont inférieurs doivent davantage se méfier et ne pas se fier à leur piété et à leurs œuvres.'),
        n('Cette crainte pousse à demander refuge et à recourir constamment à Allah, et à connaître la réalité du shirk majeur et mineur ainsi que ses moyens pour s’en préserver (comme le faisait Hudhayfa, qu’Allah l’agrée, en interrogeant sur le mal par crainte d’y tomber), avec le souci de préserver sa famille en obéissance à Sa parole : ﴾Préservez-vous vous-mêmes et vos familles d’un Feu﴿, et en s’attachant aux invocations prophétiques comme : « Ô Allah, je cherche refuge auprès de Toi contre la mécréance et la pauvreté... »'),
      ]),
    ], 1),
    n('2. La leçon tirée de l’état du plus grand nombre', [
      n('Le grand nombre de ceux qui suivent une voie n’est pas une preuve de vérité', [
        n('Rappel de la parole d’Abraham (paix sur lui) : ﴾Seigneur, elles ont égaré beaucoup de gens﴿, pour montrer que le grand nombre d’égarés ne rend pas leur voie vraie, et que c’est la minorité qui persévère dans la gratitude et la foi, comme dans Sa parole : ﴾Et peu de Mes serviteurs sont reconnaissants﴿ et ﴾Et la plupart des gens, même si tu le désires ardemment, ne sont pas croyants﴿.'),
      ]),
    ], 1),
    n('3. L’ostentation (riyâ), ses formes et son danger aujourd’hui', [
      n('Le sens de l’ostentation et sa forme', [
        n('L’ostentation fait partie du shirk mineur que le Prophète (paix et salut sur lui) a craint pour sa communauté et ses pieux (comme celui qui embellit sa prière pour le regard d’autrui), et elle diffère de l’ostentation pure des hypocrites, qui fait sortir de la religion.'),
      ]),
      n('L’ostentation à l’ère des téléphones et des réseaux de diffusion', [
        n('Mise en garde contre le fait de transformer les actes d’adoration (comme le hajj, la omra, la lecture du Coran et l’invocation) en occasions d’exhibition et de filmage via les téléphones, ce qui expose l’intention du serviteur à l’ostentation et à la quête de réputation, et fait perdre la récompense de la peine et de la dépense engagées ; insistance sur la sincérité de l’intention envers Allah, comme l’a invoqué le Prophète (paix et salut sur lui) : « Un hajj sans ostentation ni recherche de réputation. »'),
      ]),
    ], 1),
    n('4. La réalité de « Lâ ilâha illa Allah » et la méthode pour l’interpréter', [
      n('Les conditions pour profiter de l’attestation', [
        n('Le simple fait de prononcer « Lâ ilâha illa Allah » ne suffit pas sans en réaliser le sens, en appliquer les exigences et être préservé de ce qui l’annule, comme le shirk. Wahb ibn Munabbih l’a comparée à la clé du Paradis, qui a besoin de « dents » faites d’œuvres et de droits pour qu’elle puisse ouvrir.'),
      ]),
      n('La méthode de l’imam Boukhari et de l’auteur du livre du Tawhid', [
        n('Interpréter les textes par les traditions et les hadiths prophétiques, comme Boukhari l’a fait dans le Livre des Funérailles en intitulant un chapitre : « Chapitre de celui dont les dernières paroles furent Lâ ilâha illa Allah », en citant le hadith d’Abou Dharr (« même s’il a commis l’adultère et même s’il a volé », tant qu’il n’a pas associé à Allah) et le hadith d’Ibn Mas’ûd (« quiconque meurt en associant quelque chose à Allah entre au Feu... »), pour montrer que le salut est conditionné par la réalisation du Tawhid et le désaveu du shirk.'),
      ]),
    ], 1),
    n('5. Le destin, ce qui précède, la fin de vie et l’effet du Tawhid sur le sort final', [
      n('La foi au destin et l’œuvre', [
        n('La foi en ce qui est déjà écrit dans la Table préservée et la crainte d’une mauvaise fin imposent de persévérer dans l’imploration et le recours constant à Allah pour demander la fermeté, sans s’en remettre au destin seul ni délaisser l’œuvre, en réponse au hadith prophétique : « Œuvrez, car chacun trouve facile ce pour quoi il a été créé », et à Sa parole : ﴾Quant à celui qui donne et craint Allah, et déclare véridique la plus belle récompense, Nous lui faciliterons la voie vers la facilité﴿.'),
        n('Importance de redresser le for intérieur et de faire correspondre l’apparent au caché, car les mauvaises fins sont à craindre pour celui qui a été hypocrite ou a montré la piété par ostentation (« selon ce qui paraît aux gens »), tandis qu’Allah affermit les sincères par la parole ferme.'),
      ]),
      n('La proximité du Paradis et du Feu, et l’anéantissement des œuvres par le shirk', [
        n('Le Paradis et le Feu sont proches du serviteur : celui qui rencontre Allah en monothéiste est sauvé et entre au Paradis par grâce et purification, et celui qui Le rencontre en associateur entre au Feu et toutes ses œuvres sont anéanties, aussi grandes et nombreuses soient-elles, comme l’établissent les versets des sourates al-An’âm et az-Zumar : ﴾Si tu avais associé, ton œuvre aurait certes été vaine﴿.'),
      ]),
    ], 1),
    n('6. Le mérite du Tawhid et l’invocation finale', [
      n('Le mérite d’être préservé du shirk', [
        n('Le mérite d’être sauvé du Feu et d’entrer au Paradis pour celui qui a réalisé le Tawhid et en est mort sincèrement de tout son cœur : ﴾Quiconque est écarté du Feu et introduit au Paradis a réussi﴿.'),
      ]),
      n('Le contenu de l’invocation finale', [
        n('Imploration pour un savoir utile, la guidance, la piété, la chasteté, la suffisance, la purification des âmes, et la droiture de la religion, de ce bas monde et de l’au-delà.'),
        n('Pardon général des péchés, invocation pour les parents, les maîtres et les gouvernants, demande de sécurité pour les pays et de réussite à faire appliquer la loi islamique.'),
        n('Soulagement des affligés, règlement des dettes, guérison des malades, secours des faibles, préservation des épreuves, et recherche de refuge contre le mal et le Feu, et demande du Paradis et de tout bien.'),
      ]),
    ], 1),
  ], 1),
  n('Devoirs', [
    n('Connaître la réalité du shirk majeur et mineur, ses causes et ses moyens pour s’en préserver, et réviser son intention dans les actes d’adoration en se méfiant de l’ostentation et du filmage.'),
    n('Multiplier l’invocation et le recours à Allah pour demander la fermeté, une bonne fin et la préservation du shirk pour soi-même et sa descendance.'),
    n('Réviser le chapitre des Funérailles dans Sahih al-Boukhari (le chapitre : « Celui dont les dernières paroles furent Lâ ilâha illa Allah ») et étudier les traditions et hadiths qui expliquent le sens de l’attestation.'),
    n('Méditer les textes religieux sur l’anéantissement des œuvres par le shirk, et concilier la foi au destin avec la persévérance dans l’œuvre pieuse et la droiture.'),
  ], 1),
]);

// Résumé écrit, généré depuis le même arbre que la carte
const bold = s => s.replace(/﴾[^﴿]*﴿/g, m => `<strong>${m}</strong>`);
const [meta, resume, points, devoirs] = data.children;
const NUM = /^(\d+)\.\s+/;
function list(items) {
  const ordered = items.every(i => NUM.test(i.content));
  const tag = ordered ? 'ol' : 'ul';
  return `<${tag}>` + items.map(i => {
    const txt = ordered ? i.content.replace(NUM, '') : i.content;
    return `<li><p>${bold(txt)}</p>${i.children.length ? list(i.children) : ''}</li>`;
  }).join('') + `</${tag}>`;
}
let html = '<blockquote><p>' + meta.children.map(m => {
  const k = m.content.indexOf(' : ');
  return `<strong>${m.content.slice(0, k)} :</strong> ${m.content.slice(k + 3)}`;
}).join('<br>') + '</p></blockquote>';
html += `<h2>${resume.content}</h2>` + resume.children.map(p => `<p>${bold(p.content)}</p>`).join('');
html += `<h2>${points.content}</h2>` + points.children.map(pt => `<h3>${pt.content}</h3>` + (pt.children.every(s => s.children.length) ? pt.children.map(s => `<h4>${s.content}</h4>${list(s.children)}`).join('') : list(pt.children))).join('');
html += `<h2>${devoirs.content}</h2><ul class="todo">` + devoirs.children.map((d, i) =>
  `<li><input type="checkbox" id="devoir-${i + 1}"><label for="devoir-${i + 1}">${bold(d.content)}</label></li>`).join('') + '</ul>';
document.getElementById('doc').innerHTML = html;

// Carte mentale : une teinte pastel par branche principale (couleurs Plaud), épaisseur décroissante avec la profondeur
const BRANCH = ['#E5CCB3', '#E5DDB3', '#CCE5B3', '#B7E5C6'];
data.payload.c = BRANCH[0];
data.children.forEach((b, i) => {
  (function paint(x) { x.payload.c = BRANCH[i % BRANCH.length]; x.children.forEach(paint); })(b);
});
(function mark(x) { if (x.payload.fold) x.payload.foldInit = 1; x.children.forEach(mark); })(data);
const depthOf = node => (node.state && node.state.path ? node.state.path.split('.').length : 1);

const { Markmap } = window.markmap;
const mm = Markmap.create('#mm', {
  color: node => node.payload.c,
  lineWidth: node => 1 + 1.5 / Math.pow(2, depthOf(node) - 1),
  maxWidth: 300,
  duration: 400,
  spacingVertical: 5,
  paddingX: 8,
  fitRatio: 0.95
}, data);
setTimeout(() => { mm.setData(data); }, 50);

const card = document.getElementById('card');
function setFull(on) {
  card.classList.toggle('full', on);
  document.body.style.overflow = on ? 'hidden' : '';
  requestAnimationFrame(() => mm.fit());
  if (on) document.getElementById('close').focus();
}
document.getElementById('open').onclick = () => setFull(true);
document.getElementById('close').onclick = () => setFull(false);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && card.classList.contains('full')) setFull(false); });
document.getElementById('zin').onclick = () => mm.rescale(1.25);
document.getElementById('zout').onclick = () => mm.rescale(0.8);
document.getElementById('fit').onclick = () => mm.fit();
let open = false;
document.getElementById('all').onclick = () => {
  open = !open;
  (function walk(x) {
    if (x !== data && x.children && x.children.length) {
      x.payload = { ...x.payload, fold: open ? 0 : (x.payload.foldInit ? 1 : 0) };
    }
    (x.children || []).forEach(walk);
  })(mm.state.data);
  mm.renderData().then(() => mm.fit());
  const b = document.getElementById('all');
  b.title = b.ariaLabel = open ? 'Replier' : 'Tout déplier';
};
window.addEventListener('resize', () => mm.fit());
window.addEventListener('load', () => setTimeout(() => mm.fit(), 300));
</script>

</body>
</html>
