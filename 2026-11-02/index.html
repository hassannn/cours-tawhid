<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Résumé en français et carte mentale de la conférence du Cheikh Abd Razzaq Al Badr au Masjid Nabawi, 02/11/2026.">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Cours du 02/11 : le mérite du Tawhid</title>

<style>
/* Layout : page de résumé type Plaud (colonne centrée 768px), puis carte mentale en encadré qui s'ouvre en plein écran */
:root {
  --bg: #ffffff;
  --fg: #111113;
  --muted: #6b6b70;
  --line: #e6e6e8;
  --quote: #c9c9ce;
  --panel: #ffffff;
  --panel-shadow: 0 2px 10px rgba(0,0,0,.10);
  --circle-open: #ffffff;
  --map-font: 300 16px/20px sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1c1e; --fg: #f2f2f2; --muted: #a1a1a6; --line: #38383a; --quote: #4a4a4e;
    --panel: #2c2c2e; --panel-shadow: 0 2px 10px rgba(0,0,0,.45); --circle-open: #1c1c1e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1c1e; --fg: #f2f2f2; --muted: #a1a1a6; --line: #38383a; --quote: #4a4a4e;
  --panel: #2c2c2e; --panel-shadow: 0 2px 10px rgba(0,0,0,.45); --circle-open: #1c1c1e;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 15px; line-height: 1.6;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top h1 { margin: 0; font-size: 13px; font-weight: 600; line-height: 1.35; text-wrap: balance; }
.top p { margin: 2px 0 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
main {
  max-width: 768px; margin: 0 auto;
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tabs { display: flex; gap: 20px; font-size: 13px; margin-bottom: 20px; }
.tabs span { color: var(--muted); }
.tabs strong { font-weight: 600; }
blockquote { margin: 0 0 8px; padding: 2px 0 2px 14px; border-left: 3px solid var(--quote); color: var(--muted); font-size: 14px; }
blockquote strong { color: var(--fg); font-weight: 600; }
h2 { font-size: 21px; line-height: 1.3; margin: 32px 0 12px; text-wrap: balance; }
h3 { font-size: 17px; line-height: 1.35; margin: 26px 0 8px; text-wrap: balance; }
h4 { font-size: 15px; line-height: 1.4; margin: 16px 0 4px; color: var(--muted); }
p { margin: 0 0 12px; }
ul, ol { margin: 0 0 12px; padding-left: 22px; }
li { margin: 6px 0; }
li > ul, li > ol { margin: 6px 0 0; }
.todo { list-style: none; padding-left: 0; }
.todo li { display: flex; gap: 10px; align-items: flex-start; }
.todo input { margin-top: 5px; flex: none; width: 15px; height: 15px; accent-color: var(--muted); }
.todo label { min-width: 0; }

.mapcard {
  position: relative; margin-top: 40px; height: 320px;
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg);
}
.mapcard .label { position: absolute; top: 10px; left: 12px; font-size: 12px; color: var(--muted); z-index: 2; }
.mapcard .open {
  position: absolute; inset: 0; z-index: 3; border: 0; background: transparent; cursor: zoom-in;
}
.mapcard .open:focus-visible { outline: 2px solid var(--muted); outline-offset: -3px; }
#mm {
  width: 100%; height: 100%; display: block;
  --markmap-text-color: var(--fg);
  --markmap-circle-open-bg: var(--circle-open);
  --markmap-max-width: 300px;
  --markmap-font: var(--map-font);
}
.controls, .close { display: none; }
.mapcard.full {
  position: fixed; inset: 0; z-index: 20; margin: 0; height: auto; border: 0; border-radius: 0;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
.mapcard.full .open, .mapcard.full .label { display: none; }
.mapcard.full .controls {
  display: flex; position: absolute;
  right: calc(16px + env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  gap: 4px; padding: 6px; background: var(--panel); border-radius: 10px; box-shadow: var(--panel-shadow);
}
.mapcard.full .close {
  display: grid; place-items: center; position: absolute;
  top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px));
  width: 36px; height: 36px; border: 0; border-radius: 8px; background: var(--panel); box-shadow: var(--panel-shadow);
  color: var(--fg); cursor: pointer;
}
.controls button {
  width: 32px; height: 32px; border: 0; border-radius: 6px;
  background: transparent; color: var(--fg); cursor: pointer; display: grid; place-items: center;
}
.controls button:hover { background: var(--line); }
.controls button:focus-visible, .close:focus-visible { outline: 2px solid var(--muted); outline-offset: 1px; }
.ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
footer { text-align: center; font-size: 12px; color: var(--muted); padding-block: 8px 32px; }
</style>
</head>
<body>


<div class="top">
  <h1>Les cours scientifiques de Son Éminence le Cheikh Pr Abd Razzaq ibn Abd al-Muhsin Al Badr</h1>
  <p>2026-11-02 10:27 · Cheikh Abd Razzaq Al Badr</p>
</div>

<main>
  <div class="tabs"><strong>Résumé</strong></div>
  <div id="doc"></div>

  <section class="mapcard" id="card" aria-label="Carte mentale">
    <span class="label">Carte mentale</span>
    <svg id="mm" class="markmap"></svg>
    <button class="open" id="open" type="button" aria-label="Ouvrir la carte mentale en plein écran"></button>
    <button class="close" id="close" type="button" title="Fermer" aria-label="Fermer la carte"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="controls" role="toolbar" aria-label="Commandes de la carte">
      <button id="zin" type="button" title="Zoom avant" aria-label="Zoom avant"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M16.5 16.5L21 21"/></svg></button>
      <button id="zout" type="button" title="Zoom arrière" aria-label="Zoom arrière"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M16.5 16.5L21 21"/></svg></button>
      <button id="fit" type="button" title="Ajuster à l'écran" aria-label="Ajuster à l'écran"><svg class="ico" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg></button>
      <button id="all" type="button" title="Tout déplier" aria-label="Tout déplier"><svg class="ico" viewBox="0 0 24 24"><path d="M4 6h16M8 12h12M12 18h8"/><circle cx="4" cy="12" r="0.8"/><circle cx="8" cy="18" r="0.8"/></svg></button>
    </div>
  </section>
</main>
<footer>Traduction française de la note Plaud du 02/11/2026</footer>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.10/dist/browser/index.js"></script>
<script>
const n = (content, children, fold) => ({ content, children: children || [], payload: fold ? { fold: 1 } : {} });
const PBUH = 'ﷺ';

const data = n("Les cours scientifiques du Cheikh Pr Abd Razz...", [
  n("", [
    n("Date : 2026-11-02"),
    n("Heure : 10:27:39"),
    n("Lieu : Masjid Nabawi, Médine"),
    n("Conférencier : Cheikh Abd Razzaq Al Badr")
  ]),
  n("Résumé", [
    n("La conférence du 02/11/2026 a traité du mérite du Tawhid, du sens de la parole « Lâ ilâha illa Allah », de ses conditions et de ses règles, à partir des annotations du Cheikh Muhammad ibn Ibrâhîm Âl ach-Cheikh sur le Kitâb at-Tawhid. Elle a expliqué le hadith de 'Itbân (qu'Allah l'agrée) : « Allah a interdit au Feu celui qui dit Lâ ilâha illa Allah en recherchant par cela le Visage d'Allah », en montrant que la condition posée est la sincérité. Elle a expliqué le hadith de 'Ubâda ibn as-Sâmit, qui réunit les cinq fondements de la croyance, le hadith de la carte (al-bitâqa), le hadith de Moïse (paix sur lui) et le hadith qudsî d'Anas « Ô fils d'Adam » en trois phrases, ainsi que ce que chaque hadith prouve par rapport au titre du chapitre."),
    n("Le commentateur a montré que la réalité de « Lâ ilâha illa Allah » repose sur la parole, la croyance, les œuvres et le fait d'être préservé du shirk, et que son profit dépend de la réunion de ces conditions : la sincérité, la science, la certitude, les œuvres, et le fait d'être préservé de ce qui l'annule, petit ou grand. Son poids dans la balance varie selon ce qui s'est ancré dans le cœur : science, certitude, véracité, amour et soumission. Il a aussi expliqué les deux piliers de « Lâ ilâha illa Allah », la négation et l'affirmation, et le sens de « Wahdahu lâ charîka lah » comme confirmation de la négation et de l'affirmation, avec des renvois à Ibn Hajar al-Haytamî dans « Fath al-Ilâh ». Il a enfin mis en garde contre l'erreur qui consiste à réserver le dhikr au nom seul ou au pronom, en dehors des formules complètes prescrites.")
  ]),
  n("Points de connaissance", [
    n("1. Le mérite du Tawhid et les hadiths du chapitre", [
      n("Le hadith de 'Itbân : « Allah a interdit au Feu celui qui dit Lâ ilâha illa Allah en recherchant par cela le Visage d'Allah » établit le mérite du Tawhid avec la condition de la sincérité : le profit dépend de la sincérité, et non de la simple parole."),
      n("Le hadith de 'Ubâda ibn as-Sâmit réunit cinq des fondements de la religion. On y trouve : « Allah le fera entrer au Paradis quelles que soient ses œuvres », ce qui montre l'effet de la réalisation de ces fondements dans le salut."),
      n("Le hadith de la carte : « Lâ ilâha illa Allah » l'emporte sur 99 registres de péchés, ce qui prouve l'importance immense du Tawhid."),
      n("Le hadith de Moïse (paix sur lui) montre que « Lâ ilâha illa Allah » est plus lourde que les cieux et la terre si on les pèse avec elle."),
      n("Le hadith qudsî d'Anas, en trois phrases « Ô fils d'Adam », réunit les trois causes du pardon : l'invocation accompagnée d'espoir, la demande de pardon, et le Tawhid avec la condition « sans rien M'associer ».")
    ], true),
    n("2. Le fruit de « Lâ ilâha illa Allah » et les règles de l'interdiction du Feu", [
      n("Les deux types d'interdiction :", [
        n("Avec la réalisation complète du Tawhid : l'entrée en Enfer est interdite de manière absolue."),
        n("En présence de péchés : c'est le séjour éternel qui est interdit, sans exclure une entrée préalable selon les péchés.")
      ]),
      n("Le sens de la condition de sincérité : « en recherchant par cela le Visage d'Allah » est une condition indispensable pour que la parole profite. Les expressions « sincèrement de son cœur » et « véridiquement de son cœur » en témoignent."),
      n("La condition « sans rien M'associer » : un nom indéfini dans un contexte de négation exprime la généralité. Être préservé de tout shirk est une condition pour que le Tawhid profite et expie les péchés.")
    ], true),
    n("3. Les sept conditions de « Lâ ilâha illa Allah » et leur déduction", [
      n("Les conditions sont : la science, la certitude, la sincérité, la véracité, l'amour, la soumission et l'acceptation. Elles sont déduites par l'examen des textes : « Celui qui meurt en sachant… », « son cœur en étant certain », « sincèrement de son cœur », « véridiquement de son cœur »."),
      n("Les hypocrites n'en tirent pas profit : ils l'ont dite sans véracité. ﴾Et Allah atteste que les hypocrites sont assurément des menteurs﴿."),
      n("Exemples des pieux prédécesseurs : la clé du Paradis et ses dents, chez Wahb ibn Munabbih ; et l'exposé d'Al-Hasan al-Basrî : « Celui qui s'acquitte de son droit et de ce qu'elle impose entre au Paradis »."),
      n("Formulations synthétiques : le vers « Science, certitude… », et le poème de Hâfiz al-Hakamî dans « Sullam al-Wusûl », avec leurs explications dans « Ma'ârij al-Qabûl », « Qurrat 'Uyûn al-Muwahhidîn » et « Fath al-Majîd ».")
    ], true),
    n("4. La réalité de la parole et la structure des invocations", [
      n("Les piliers de « Lâ ilâha illa Allah » : la négation dans « Lâ ilâha », qui nie toute divinité adorée en vérité en dehors d'Allah, et l'affirmation dans « illa Allah », qui affirme l'adoration pour Allah Seul. Le Tawhid ne se réalise que par leur réunion."),
      n("« Wahdahu lâ charîka lah » : c'est une confirmation de l'affirmation et de la négation, et un surcroît d'attention au rang du Tawhid. Le texte est rapporté mot pour mot d'Ibn Hajar al-Haytamî dans « Fath al-Ilâh », et certains commentateurs l'attribuent à Ibn Hajar dans d'autres passages."),
      n("Les invocations prescrites sont des phrases complètes au sens entier : le tahlîl, le tasbîh, le tahmîd, le takbîr, « Lâ hawla wa lâ quwwata illâ billâh ». Il est faux de réserver le dhikr, par innovation, au nom seul « Allah » ou au pronom « Huwa ».")
    ], true),
    n("5. « Lâ ilâha illa Allah » englobe les deux types d'invocation", [
      n("L'invocation d'adoration et l'invocation de demande : le tahlîl réunit les deux. Celui qui fait l'éloge d'Allah espère et demande, et celui qui demande se conforme, adore sincèrement et recherche l'intercession par Ses noms et Ses attributs."),
      n("« Lâ ilâha illa Allah » est la meilleure des évocations et la meilleure des invocations. Elle est une demande implicite de récompense, de pardon et de salut.")
    ], true),
    n("6. L'effet du shirk sur les œuvres et l'expiation", [
      n("Le shirk majeur annule toutes les œuvres : ﴾Si tu donnes des associés, tes œuvres seront certes vaines﴿."),
      n("Le shirk mineur affaiblit ou empêche l'effet expiatoire de « Lâ ilâha illa Allah » selon son degré, et diminue le poids de la parole dans la balance.")
    ], true),
    n("7. L'ordre des hadiths entre absolu et restreint", [
      n("L'ordre suivi par l'auteur : le premier est absolu ('Ubâda), le deuxième restreint ('Itbân), le troisième absolu (Abû Sa'îd et le hadith de la carte), le quatrième restreint (Anas)."),
      n("La sagesse : restreindre les textes absolus par les conditions de la science, des œuvres et de la préservation de ce qui annule le Tawhid, et attirer l'attention sur « en recherchant par cela le Visage d'Allah » et « sans rien M'associer ».")
    ], true),
    n("8. La méthode de recherche scientifique", [
      n("L'attribution des paroles : il n'a pas été possible d'attribuer un texte à Ibn Hajar al-'Asqalânî ; il a été trouvé chez Ibn Hajar al-Haytamî dans « Fath al-Ilâh », et les commentateurs d'« Al-Michkât » l'ont repris."),
      n("L'évolution des outils de recherche : on est passé de la consultation manuelle des livres à la recherche numérique, mais la consultation manuelle reste utile pour connaître la structure des livres et l'emplacement des questions."),
      n("Exemple : la recherche sur le nom d'Allah « Al-Muhsin ». Ibn 'Uthaymîn a hésité dans « Al-Qawâ'id al-Muthlâ », et Ibn Taymiyya l'a compté parmi les plus beaux noms ; il faut retrouver avec précision les passages de « Majmû' al-Fatâwâ ».")
    ], true)
  ]),
  n("Devoirs", [
    n("Rassembler les preuves textuelles des sept conditions de la parole du Tawhid, tirées du Coran et de la Sunna, en indiquant les sources (Sahîh Muslim, Al-Musnad, etc.)."),
    n("Consulter « Fath al-Ilâh fî Charh al-Michkât » d'Ibn Hajar al-Haytamî pour vérifier le texte « Wahdahu lâ charîka lah, confirmation après confirmation » et noter son emplacement."),
    n("Préparer un résumé comparatif des explications des conditions de « Lâ ilâha illa Allah » dans « Sullam al-Wusûl », « Ma'ârij al-Qabûl », « Qurrat 'Uyûn al-Muwahhidîn » et « Fath al-Majîd »."),
    n("Rassembler les quatre hadiths du chapitre, les classer en absolus et restreints, et expliquer comment le hadith d'Anas restreint les textes absolus par la condition « sans rien M'associer »."),
    n("Rédiger une note sur la différence entre le shirk majeur et le shirk mineur et leur effet sur la validité des œuvres et l'expiation des péchés, avec des exemples tirés des textes."),
    n("Étudier l'attribution du nom d'Allah « Al-Muhsin » entre les avis d'Ibn Taymiyya et d'Ibn 'Uthaymîn, en retrouvant les passages de « Majmû' al-Fatâwâ » et en notant les résultats."),
    n("S'exercer à la méthode traditionnelle : feuilleter à la main les index et les textes des sources principales pour connaître la structure des livres et l'emplacement des questions."),
    n("Méditer le sens des invocations transmises, en gardant à l'esprit que ce sont des phrases complètes qui réunissent le Tawhid, l'éloge et la demande.")
  ])
]);

// Résumé écrit, généré depuis le même arbre que la carte
const bold = s => s.replace(/﴾[^﴿]*﴿/g, m => `<strong>${m}</strong>`);
const [meta, resume, points, devoirs] = data.children;
const NUM = /^(\d+)\.\s+/;
function list(items) {
  const ordered = items.every(i => NUM.test(i.content));
  const tag = ordered ? 'ol' : 'ul';
  return `<${tag}>` + items.map(i => {
    const txt = ordered ? i.content.replace(NUM, '') : i.content;
    return `<li><p>${bold(txt)}</p>${i.children.length ? list(i.children) : ''}</li>`;
  }).join('') + `</${tag}>`;
}
let html = '<blockquote><p>' + meta.children.map(m => {
  const k = m.content.indexOf(' : ');
  return `<strong>${m.content.slice(0, k)} :</strong> ${m.content.slice(k + 3)}`;
}).join('<br>') + '</p></blockquote>';
html += `<h2>${resume.content}</h2>` + resume.children.map(p => `<p>${bold(p.content)}</p>`).join('');
html += `<h2>${points.content}</h2>` + points.children.map(pt => `<h3>${pt.content}</h3>` + (pt.children.every(s => s.children.length) ? pt.children.map(s => `<h4>${s.content}</h4>${list(s.children)}`).join('') : list(pt.children))).join('');
html += `<h2>${devoirs.content}</h2><ul class="todo">` + devoirs.children.map((d, i) =>
  `<li><input type="checkbox" id="devoir-${i + 1}"><label for="devoir-${i + 1}">${bold(d.content)}</label></li>`).join('') + '</ul>';
document.getElementById('doc').innerHTML = html;

// Carte mentale : une teinte pastel par branche principale (couleurs Plaud), épaisseur décroissante avec la profondeur
const BRANCH = ['#E5CCB3', '#E5DDB3', '#CCE5B3', '#B7E5C6'];
data.payload.c = BRANCH[0];
data.children.forEach((b, i) => {
  (function paint(x) { x.payload.c = BRANCH[i % BRANCH.length]; x.children.forEach(paint); })(b);
});
(function mark(x) { if (x.payload.fold) x.payload.foldInit = 1; x.children.forEach(mark); })(data);
const depthOf = node => (node.state && node.state.path ? node.state.path.split('.').length : 1);

const { Markmap } = window.markmap;
const mm = Markmap.create('#mm', {
  color: node => node.payload.c,
  lineWidth: node => 1 + 1.5 / Math.pow(2, depthOf(node) - 1),
  maxWidth: 300,
  duration: 400,
  spacingVertical: 5,
  paddingX: 8,
  fitRatio: 0.95
}, data);

const card = document.getElementById('card');
function setFull(on) {
  card.classList.toggle('full', on);
  document.body.style.overflow = on ? 'hidden' : '';
  requestAnimationFrame(() => mm.fit());
  if (on) document.getElementById('close').focus();
}
document.getElementById('open').onclick = () => setFull(true);
document.getElementById('close').onclick = () => setFull(false);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && card.classList.contains('full')) setFull(false); });
document.getElementById('zin').onclick = () => mm.rescale(1.25);
document.getElementById('zout').onclick = () => mm.rescale(0.8);
document.getElementById('fit').onclick = () => mm.fit();
let open = false;
document.getElementById('all').onclick = () => {
  open = !open;
  (function walk(x) {
    if (x !== data && x.children && x.children.length) {
      x.payload = { ...x.payload, fold: open ? 0 : (x.payload.foldInit ? 1 : 0) };
    }
    (x.children || []).forEach(walk);
  })(mm.state.data);
  mm.renderData().then(() => mm.fit());
  const b = document.getElementById('all');
  b.title = b.ariaLabel = open ? 'Replier' : 'Tout déplier';
};
window.addEventListener('resize', () => mm.fit());
window.addEventListener('load', () => setTimeout(() => mm.fit(), 300));
</script>

</body>
</html>
